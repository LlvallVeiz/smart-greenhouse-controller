[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-greenhouse-controller"
version = "1.0.0"
description = "Simulator sensor rumah kaca, kontrol hysteresis irigasi/ventilasi/pemanas/cahaya/CO2, analisis dan dashboard"
authors = [{name = "LlvallVeiz"}]
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
greenhouse = "smart_greenhouse_controller.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
